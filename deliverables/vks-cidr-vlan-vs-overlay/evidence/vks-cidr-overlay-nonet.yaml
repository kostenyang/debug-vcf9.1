# CIDR 驗證：照客戶投影片 Service 100.64.0.0/13 / Pod 100.96.0.0/18，overlay FULL_STACK VPC（m06 重做）
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: vks-cidr-overlay
  namespace: vks-ov
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 100.96.0.0/18
    services:
      cidrBlocks:
        - 100.64.0.0/13
    serviceDomain: cluster.local
  topology:
    classRef:
      name: builtin-generic-v3.7.0
      namespace: vmware-system-vks-public
    version: v1.36.2---vmware.2-vkr.3
    variables:
      - name: vmClass
        value: best-effort-small
      - name: storageClass
        value: vks-ftt0
    controlPlane:
      replicas: 1
      metadata:
        annotations:
          run.tanzu.vmware.com/resolve-os-image: os-name=photon
    workers:
      machineDeployments:
        - class: node-pool
          name: np-1
          replicas: 1
          metadata:
            annotations:
              run.tanzu.vmware.com/resolve-os-image: os-name=photon
